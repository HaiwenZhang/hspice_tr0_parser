name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          PYTHON_VERSION="$(awk -F '"' '/^version = "/ { print $2; exit }' pyproject.toml)"
          WASM_VERSION="$(node -p "require('./crates/hspice-wasm/package.json').version")"
          JAVA_VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' java/pom.xml | head -n 1)"

          for version in "$CARGO_VERSION" "$PYTHON_VERSION" "$WASM_VERSION" "$JAVA_VERSION"; do
            if [[ "$version" != "$TAG_VERSION" ]]; then
              echo "Version mismatch: tag=$TAG_VERSION package=$version" >&2
              exit 1
            fi
          done

          grep -F 'requires-python = ">=3.12"' pyproject.toml
          grep -F '"abi3-py312"' Cargo.toml

  rust-test:
    name: Rust workspace tests
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  python-test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}-${{ matrix.python }}

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip maturin numpy pytest

      - name: Build and install extension
        run: python -m pip install --no-build-isolation --no-deps .

      - name: Run Python tests
        run: python -m pytest tests -v

  python-wheels:
    name: Python wheel (${{ matrix.asset }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-24.04
            target: x86_64
            linux: true
          - asset: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            linux: true
          - asset: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            linux: false
          - asset: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            linux: false
          - asset: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            linux: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build manylinux wheel
        if: matrix.linux
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: "2014"

      - name: Build macOS or Windows wheel
        if: ${{ !matrix.linux }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python

      - uses: actions/upload-artifact@v4
        with:
          name: release-python-${{ matrix.asset }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python source distribution
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.target }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI
        run: cargo build -p hspice-cli --release --locked --target ${{ matrix.target }}

      - name: Package CLI (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="hspice-cli-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/hspice-cli" "dist/${STAGE}/"
          cp README.md LICENSE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Package CLI (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $stage = "hspice-cli-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/hspice-cli.exe" "dist/$stage/"
          Copy-Item README.md, LICENSE "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  ffi:
    name: C ABI (${{ matrix.target }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            archive: zip
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-${{ matrix.target }}

      - name: Build C ABI libraries
        run: cargo build -p hspice-ffi --release --locked --target ${{ matrix.target }}

      - name: Package C ABI (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="hspice-ffi-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}/include" "dist/${STAGE}/lib"
          cp include/hspice_tr0_parser.h "dist/${STAGE}/include/"
          cp README.md LICENSE docs/api/c_cpp.md "dist/${STAGE}/"
          cp "target/${{ matrix.target }}/release/libhspicetr0parser.a" "dist/${STAGE}/lib/"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            cp "target/${{ matrix.target }}/release/libhspicetr0parser.so" "dist/${STAGE}/lib/"
          else
            cp "target/${{ matrix.target }}/release/libhspicetr0parser.dylib" "dist/${STAGE}/lib/"
          fi
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Package C ABI (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $stage = "hspice-ffi-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$stage/include", "dist/$stage/lib" | Out-Null
          Copy-Item include/hspice_tr0_parser.h "dist/$stage/include/"
          Copy-Item README.md, LICENSE, docs/api/c_cpp.md "dist/$stage/"
          Copy-Item "target/${{ matrix.target }}/release/hspicetr0parser.dll" "dist/$stage/lib/"
          Get-ChildItem "target/${{ matrix.target }}/release/hspicetr0parser*.lib" |
            Copy-Item -Destination "dist/$stage/lib/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-ffi-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  wasm:
    name: WASM npm package
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM package
        working-directory: crates/hspice-wasm
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Create npm archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp LICENSE crates/hspice-wasm/pkg/LICENSE
          PACKAGE_FILE="$(npm pack ./crates/hspice-wasm/pkg --silent)"
          mv "$PACKAGE_FILE" "dist/hspice-wasm-${VERSION}.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: dist/*.tgz
          if-no-files-found: error

  java:
    name: Java JAR
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Test and build Java bindings
        run: mvn -B -f java/pom.xml test package

      - name: Package Java distribution
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="hspice-java-${VERSION}"
          mkdir -p "dist/${STAGE}"
          cp "java/target/hspice-parser-${VERSION}.jar" "dist/"
          cp "java/target/hspice-parser-${VERSION}.jar" "dist/${STAGE}/"
          cp java/pom.xml "dist/${STAGE}/pom.xml"
          cp java/README.md "dist/${STAGE}/README.md"
          cp LICENSE "dist/${STAGE}/"
          (
            cd dist
            zip -r "${STAGE}.zip" "${STAGE}"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: release-java
          path: |
            dist/hspice-parser-*.jar
            dist/hspice-java-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - rust-test
      - python-test
      - python-wheels
      - python-sdist
      - cli
      - ffi
      - wasm
      - java
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Add asset guide and checksums
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '## Release assets' \
            '' \
            '- Python: CPython 3.12+ stable-ABI wheels for Linux, macOS, and Windows, plus an sdist.' \
            '- CLI: standalone archives for Linux x86_64/aarch64, macOS Intel/Apple Silicon, and Windows x86_64.' \
            '- C ABI: native static/dynamic libraries and the public header for the same native targets.' \
            '- WASM: an npm-compatible web package (`hspice-wasm-<version>.tgz`).' \
            '- Java: the platform-independent JNA wrapper JAR and a ZIP with its Maven POM; download the matching C ABI archive as well.' \
            '- Go: use the matching C ABI archive through CGO; there is no separate Go module in this release.' \
            '' \
            'Verify downloads with `SHA256SUMS`.' \
            > dist/RELEASE-ASSETS.md
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
          ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: hspice_tr0_parser ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: dist/RELEASE-ASSETS.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
