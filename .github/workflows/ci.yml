name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  python-test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: rust-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}-${{ matrix.python }}

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip maturin numpy pytest

      - name: Build and install extension
        run: python -m pip install --no-build-isolation --no-deps .

      - name: Run Python tests
        run: python -m pytest tests -v

  wheel-smoke:
    name: Build abi3 wheel and sdist
    needs: python-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux x86_64 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --locked --out dist
          manylinux: "2014"

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist
          if-no-files-found: error
